name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Arrange project files
        run: |
          set -e
          B="$RUNNER_TEMP/b"; M="$B/src/main"
          mkdir -p "$M/java/com/projects/tracker" "$M/assets" "$M/res"
          one() {
            p=$(find . -path ./.git -prune -o -type f -name "$1" -print | head -1)
            if [ -z "$p" ]; then echo "::error::Missing file: $1"; exit 1; fi
            cp "$p" "$2"
          }
          one tracker-settings.gradle "$B/settings.gradle"
          one tracker-build.gradle    "$B/build.gradle"
          one tracker.properties      "$B/gradle.properties"
          one tracker.keystore        "$B/tracker.keystore"
          one TrackerManifest.xml     "$M/AndroidManifest.xml"
          one tracker-app.html        "$M/assets/index.html"
          for j in MainActivity CheckWorker Summary Mailer Store TaskWidget TaskWidgetService; do one "$j.java" "$M/java/com/projects/tracker/$j.java"; done
          find . -path ./.git -prune -o -type f -name "res__*" -print | while read -r f; do
            n=$(basename "$f"); rest=${n#res__}; dir=${rest%%__*}; file=${rest#*__}
            mkdir -p "$M/res/$dir"; cp "$f" "$M/res/$dir/$file"
          done
      - name: Build
        run: |
          cd "$RUNNER_TEMP/b"
          gradle assembleDebug --no-daemon
          cp build/outputs/apk/debug/*.apk "$RUNNER_TEMP/ProjectTracker.apk"
      - name: Publish for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_id }}" "$RUNNER_TEMP/ProjectTracker.apk" \
            --repo "${{ github.repository }}" \
            --title "מעקב פרויקטים – $(date +%d/%m/%Y\ %H:%M)" \
            --notes "טלפון: ProjectTracker.apk · מחשב: ProjectTracker-Desktop.exe"

  desktop:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Arrange desktop files
        run: |
          set -e
          mkdir -p desk
          one() {
            p=$(find . -path ./.git -prune -o -path ./desk -prune -o -type f -name "$1" -print | head -1)
            if [ -z "$p" ]; then echo "::error::Missing file: $1"; exit 1; fi
            cp "$p" "$2"
          }
          one desktop-main.js      desk/main.js
          one desktop-package.json desk/package.json
          one desktop-app.html     desk/index.html
          one desktop-icon.png     desk/icon.png
      - name: Build Windows program
        working-directory: desk
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --publish never
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "build-${{ github.run_id }}" desk/dist/ProjectTracker-Desktop.exe \
            --repo "${{ github.repository }}" --clobber
