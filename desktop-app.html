  --ok:#0f9f6e; --ok-bg:#e1f6ee; --part:#d98200; --part-bg:#fff1dc; --site:#2f6bff; --site-bg:#e4ecff;

  --font:"Heebo","Segoe UI",Arial,sans-serif; --num:"Orbitron","Heebo","Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060a17; --surface:#0d1428; --surface-2:#131c35; --ink:#e6ecf8; --ink-2:#8c9ab8; --line:#1e2945;
    --hero1:#050918; --hero2:#121f52;
    --ok:#2bd497; --ok-bg:#0b2a22; --part:#ffb340; --part-bg:#2e2210; --site:#6e9bff; --site-bg:#121f45;
    --office:#a98bff; --office-bg:#211a40; --bad:#ff6b70; --bad-bg:#341418; --na:#6b7894; --na-bg:#18213a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060a17; --surface:#0d1428; --surface-2:#131c35; --ink:#e6ecf8; --ink-2:#8c9ab8; --line:#1e2945;
  --hero1:#050918; --hero2:#121f52;
  --ok:#2bd497; --ok-bg:#0b2a22; --part:#ffb340; --part-bg:#2e2210; --site:#6e9bff; --site-bg:#121f45;
  --office:#a98bff; --office-bg:#211a40; --bad:#ff6b70; --bad-bg:#341418; --na:#6b7894; --na-bg:#18213a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero1)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);margin:0 -14px;padding:20px 18px 18px;border-radius:0 0 28px 28px;
  background:radial-gradient(90% 70% at 0% 0%,rgba(19,194,227,.28),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(47,107,255,.35),transparent 60%),linear-gradient(160deg,var(--hero1),var(--hero2))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.hero .sub{color:var(--hero-dim);font-size:.92rem;margin-top:2px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:inherit;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .2s,background .2s}
.stage .v{font-family:var(--num);font-weight:700;font-size:1.2rem;line-height:1}
.stage .l{font-size:.72rem;color:var(--hero-dim);line-height:1.15;text-align:center}
.stage[aria-pressed="true"]{border-color:var(--accent-2);background:rgba(19,194,227,.16);box-shadow:0 0 0 1px var(--accent-2) inset,0 0 22px var(--glow)}
.stage[aria-pressed="true"] .v{color:#7ff0ff;text-shadow:0 0 10px var(--glow)}
.stage[aria-pressed="true"] .l{color:#fff}

.tools{display:flex;gap:8px;margin:16px 0 10px}
.search{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-width:0;box-shadow:var(--shadow)}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;white-space:nowrap;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}
.note{font-size:.88rem;color:var(--ink-2);margin:6px 2px 10px}

/* alert */
.alert{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:16px;padding:12px 14px;margin-top:14px;box-shadow:var(--shadow)}
.alert-h{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:800;margin-bottom:4px}
.alert-h .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.alert-i{display:flex;gap:6px;align-items:baseline;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;font-size:.92rem}
.alert-i span{margin-inline-start:auto;color:var(--bad);font-weight:700;white-space:nowrap;font-size:.85rem}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.99)}
.card-top{display:flex;align-items:center;gap:12px}
.ring{flex:none;position:relative;width:44px;height:44px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:.66rem;font-weight:700}
.card-main{flex:1;min-width:0}
.card-name{font-weight:700;font-size:1.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--ink-2);margin-top:2px}
.chip .n{font-family:var(--num);font-size:.68rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:6px;padding:2px 6px}
.strip{display:flex;gap:3px;margin-top:12px}
.seg{flex:1;height:6px;border-radius:99px;background:var(--na-bg)}
.seg.ok{background:var(--ok)} .seg.part{background:var(--part)} .seg.site{background:var(--site)} .seg.office{background:var(--office)} .seg.bad{background:var(--bad)}
.seg.na{background:repeating-linear-gradient(135deg,var(--na-bg) 0 3px,transparent 3px 6px);outline:1px solid var(--na-bg)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.tag b{font-family:var(--num);font-size:.72rem;margin-inline-end:3px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.site{background:var(--site-bg);color:var(--site)} .tag.office{background:var(--office-bg);color:var(--office)} .tag.part{background:var(--part-bg);color:var(--part)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}

/* tab bar + fab */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:6;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar .in{display:flex;gap:4px;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;border-radius:12px;color:var(--ink-2);font-size:.76rem;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--site-bg)}

<script>
(function(){

function cls(v){

  if(v==="במשרד")return"office";

  return{name:name||"פרויקט חדש",status:"לא התחיל",order:order,
    sets:{cam:{order:"",status:""},comm:{order:"",status:""},cp:{order:"",status:""}},

const DEFAULT_SETTINGS={emailEnabled:false,recipients:[],from:"",emailHour:8,pushHour:9};

// ---------- storage ----------

function stamp(id,patch){

// ---------- summary (also used for the daily email in the app) ----------
function buildSummary(){
  const rows=[]; let nT=0,nS=0,nL=0;
  sorted().forEach(([,p])=>{
    const tasks=p.tasks.filter(x=>!x.done);
    const steps=p.steps.map((s,i)=>({s,i,d:bizDays(s.plan)})).filter(x=>!x.s.na&&x.s.plan&&!x.s.done);
    if(!tasks.length&&!steps.length)return;
    nT+=tasks.length;nS+=steps.length;
    const lines=["■ "+p.name+(p.status?" ("+p.status+")":"")];
    tasks.forEach(x=>lines.push("   • משימה: "+x.text+" – "+openLabel(daysOpen(x.opened))));
    steps.forEach(x=>{const late=x.d>=LATE;if(late)nL++;lines.push("   • שלב: "+STEPS[x.i]+" – אושר לפני "+x.d+" ימי עבודה"+(late?" ⚠ באיחור":""))});
    rows.push(lines.join("\n"));
  });
  const d=new Date();
  const head="סיכום נושאים פתוחים – "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()+"\n"+
    nT+" משימות פתוחות · "+nS+" שלבים בביצוע"+(nL?" (מתוכם "+nL+" באיחור)":"")+"\n";
  return rows.length?head+"\n"+rows.join("\n\n"):head+"\nאין נושאים פתוחים. כל הכבוד!";
}

    const before=t.slice(0,st);const m=/\s(בפרויקט|לפרויקט|של פרויקט|פרויקט|עבור|של|ב|ל)\s?-?$/.exec(before);
    if(m)st=m.index; else if(t[st-1]==="ב"||t[st-1]==="ל")st--;

// ---------- Hebrew voice parsing for meetings ----------
const HEB_NUM={"אחת":1,"אחד":1,"שתיים":2,"שתים":2,"שניים":2,"שלוש":3,"ארבע":4,"חמש":5,"שש":6,"שבע":7,"שמונה":8,"תשע":9,"עשר":10,"אחת עשרה":11,"אחד עשר":11,"שתים עשרה":12,"שתיים עשרה":12,"שנים עשר":12};
const HEB_DAYS={"ראשון":0,"שני":1,"שלישי":2,"רביעי":3,"חמישי":4,"שישי":5,"שבת":6};
const HEB_MONTHS={"ינואר":1,"פברואר":2,"מרץ":3,"מרס":3,"אפריל":4,"מאי":5,"יוני":6,"יולי":7,"אוגוסט":8,"ספטמבר":9,"אוקטובר":10,"נובמבר":11,"דצמבר":12};
function parseMeeting(text,projectList){
  const t=" "+String(text||"").replace(/[“”"׳']/g,"").replace(/\s+/g," ").trim()+" ";
  const spans=[]; const mark=(m)=>{if(m)spans.push([m.index,m.index+m[0].length])};
  const now=new Date(); let date=null, hour=null, minute=0, dur=60, project="", m;
  const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const addDays=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return d};
  // date
  if((m=/ (ב)?מחרתיים /.exec(t))){date=addDays(2);mark(m)}
  else if((m=/ (ל|ב)?מחר /.exec(t))){date=addDays(1);mark(m)}
  else if((m=/ (ל|ב)?היום /.exec(t))){date=addDays(0);mark(m)}
  if(!date&&(m=/ (ב|ל)?יום (ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)( הבא| הקרוב)? /.exec(t))){
    const target=HEB_DAYS[m[2]]; let diff=(target-now.getDay()+7)%7; if(diff===0)diff=7; date=addDays(diff); mark(m)}
  if(!date&&(m=/ (ב|ל)?(שבוע הבא) /.exec(t))){date=addDays(7);mark(m)}
  if(!date&&(m=/ בעוד (\d+|שבוע|יומיים) (ימים )?/.exec(t))){const n=m[1]==="שבוע"?7:m[1]==="יומיים"?2:+m[1];date=addDays(n);mark(m)}
  if(!date&&(m=/ (ב|ל)?-?(\d{1,2})[./](\d{1,2})([./](\d{2,4}))? /.exec(t))){
    let y=m[5]?+m[5]:now.getFullYear(); if(y<100)y+=2000; date=new Date(y,+m[3]-1,+m[2]); if(!m[5]&&date<addDays(-1))date.setFullYear(y+1); mark(m)}
  if(!date){const re=new RegExp(" (ב|ל)?-?(\\d{1,2}) (ב|ל)?("+Object.keys(HEB_MONTHS).join("|")+") ");
    if((m=re.exec(t))){date=new Date(now.getFullYear(),HEB_MONTHS[m[4]]-1,+m[2]);if(date<addDays(-1))date.setFullYear(now.getFullYear()+1);mark(m)}}
  // time: digits "10:30" / "בשעה 14" / "ב-9"
  if((m=/ (ב|בשעה|ב-)\s?-?(\d{1,2})[:.](\d{2}) /.exec(t))||(m=/ (\d{1,2}):(\d{2}) /.exec(t))){
    const hh=m.length===4?+m[2]:+m[1], mm=m.length===4?+m[3]:+m[2]; hour=hh;minute=mm;mark(m)}
  else if((m=/ (בשעה|ב-|ב) ?(\d{1,2})( וחצי| ורבע| פחות רבע)? /.exec(t))&&+m[2]<=23){hour=+m[2];minute=m[3]===" וחצי"?30:m[3]===" ורבע"?15:0;if(m[3]===" פחות רבע"){hour-=1;minute=45}mark(m)}
  else{const words=Object.keys(HEB_NUM).sort((a,b)=>b.length-a.length).join("|");
    const re=new RegExp(" (בשעה |ב)("+words+")( וחצי| ורבע| פחות רבע)? ");
    if((m=re.exec(t))){hour=HEB_NUM[m[2]];minute=m[3]===" וחצי"?30:m[3]===" ורבע"?15:0;if(m[3]===" פחות רבע"){hour-=1;minute=45}mark(m)}}
  if(hour!=null){
    if((m=/ (ב|של |לפני ה|אחרי ה)?(בוקר|צהריים|צהרים|אחר הצהריים|אחרי הצהריים|אחה"צ|ערב|לילה) /.exec(t))){
      const part=m[2]; if(/צהר|ערב|לילה/.test(part)&&hour<12)hour+=12; if(/צהריים|צהרים/.test(part)&&hour>=13&&hour<=14&&!/אחר/.test(part))hour-=12; mark(m)}
    else if(hour>=1&&hour<=6)hour+=12;
  }
  // duration
  if((m=/ ל(שעה וחצי|שעתיים|חצי שעה|שעה|רבע שעה) /.exec(t))){dur={"שעה וחצי":90,"שעתיים":120,"חצי שעה":30,"שעה":60,"רבע שעה":15}[m[1]];mark(m)}
  else if((m=/ ל-?(\d{1,3}) דקות /.exec(t))){dur=+m[1];mark(m)}
  // project / location
  let best=null;
  (projectList||[]).forEach(([id,name])=>{const n=String(name).trim();if(!n)return;
    const i=t.indexOf(n); if(i>=0&&(!best||n.length>best.n.length))best={id,n,i}});
  let location="";
  if(best){project=best.id;location=best.n;let st=best.i;if(t[st-1]==="ב"||t[st-1]==="ל")st--;if(t[st-1]==="-")st--;spans.push([st,best.i+best.n.length])}
  else if((m=/ במשרד /.exec(t))){location="משרד";mark(m)}
  // title = what is left
  spans.sort((a,b)=>b[0]-a[0]); let rest=t; spans.forEach(([a,b])=>{rest=rest.slice(0,a)+" "+rest.slice(b)});
  rest=rest.replace(/^\s*(תקבע|קבע|תוסיף|הוסף|תכניס|לקבוע|להוסיף|תרשום|רשום)( לי)?( את)?\s*/,"").replace(/\s+(ב|ל|של|ו|-)\s*$/,"").replace(/\s+/g," ").trim();
  rest=rest.replace(/^(ב|ל)\s+/,"").trim();
  if(!rest)rest="פגישה"; else if(!/^(פגישה|ישיבה|שיחה|סיור|בדיקה)/.test(rest)&&rest.length<40&&/^עם /.test(rest))rest="פגישה "+rest;
  return {title:rest,date:date?ymd(date):"",time:hour!=null?String(hour).padStart(2,"0")+":"+String(minute).padStart(2,"0"):"",duration:dur,project,location};
}

async function gh(c,method,body){
  const r=await fetch("https://api.github.com/repos/"+c.repo+"/contents/data/tracker-data.json",{method,cache:"no-store",
    headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined});
  return r;
}
async function syncNow(loud){
  const c=syncCfg(); if(!c)return false;
  if(syncing){syncAgain=true;return false} syncing=true;
  try{
    for(let attempt=0;attempt<3;attempt++){
      let r=await gh(c,"GET"); let remote=null, sha=null;
      if(r.status===404){remote=null}
      else if(r.ok){const j=await r.json();sha=j.sha;
        let txt=j.content?b64dec(j.content):"";
        if(!txt&&j.size>0){const rr=await fetch("https://api.github.com/repos/"+c.repo+"/contents/data/tracker-data.json",{cache:"no-store",headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github.raw+json"}});txt=await rr.text()}
        remote=txt?JSON.parse(txt):null}
      else if(r.status===401||r.status===403){throw new Error("auth")}
      else throw new Error("http "+r.status);
      const local={projects,deleted,team,settings};
      const m=mergeData(local,remote);
      // apply to this device
      syncQuiet=true;
      projects={};Object.keys(m.projects).forEach(k=>projects[k]=norm(m.projects[k]));
      if(!projects[GENERAL])projects[GENERAL]=norm(generalBlank());
      deleted=m.deleted; team=normTeam(m.team); settings=normSettings(m.settings);
      lsSave(); syncQuiet=false;
      const out={app:"project-tracker",projects:m.projects,deleted:m.deleted,team:m.team,settings:m.settings};
      if(remote&&stable({p:remote.projects,d:remote.deleted||{},t:remote.team,s:remote.settings})===stable({p:out.projects,d:out.deleted,t:out.team,s:out.settings})){done();return true}
      out.updatedAt=new Date().toISOString(); out.device=window.Android?"phone":"computer";
      const body={message:"sync from "+out.device,content:b64enc(JSON.stringify(out))}; if(sha)body.sha=sha;
      const w=await gh(c,"PUT",body);
      if(w.ok){done();return true}
      if(w.status===409||w.status===422)continue;
      if(w.status===401||w.status===403||w.status===404)throw new Error("auth");
      throw new Error("http "+w.status);
    }
    throw new Error("conflict");
  }catch(e){
    syncQuiet=false;
    setSyncConf({lastError:e.message==="auth"?"אין הרשאה: בדוק את שם המאגר ואת הטוקן":"אין חיבור לשרת, ננסה שוב"});
    if(loud||!syncErrShown){toast(e.message==="auth"?"הסנכרון נכשל: אין הרשאה למאגר":"הסנכרון נכשל, ננסה שוב בהמשך");syncErrShown=true}
    if(location.hash==="#settings")renderSettings();
    return false;
  }finally{
    syncing=false; if(syncAgain){syncAgain=false;scheduleSync()}
  }
  function done(){setSyncConf({last:Date.now(),lastError:""});syncErrShown=false;
    const ae=document.activeElement; if(!(ae&&app.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")))render(true);
    if(loud)toast("סונכרן ✓")}
}

async function saveSync(){
  const repo=(document.getElementById("syRepo").value||"").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,"");
  const tok=(document.getElementById("syToken").value||"").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast("שם המאגר צריך להיות בפורמט user/repo");return}
  const c=syncConf(); if(!tok&&!c.token){toast("חסר טוקן");return}
  setSyncConf({repo,token:tok||c.token,lastError:""});
  toast("מתחבר…"); const ok=await syncNow(true); renderSettings(); if(ok)toast("החיבור הצליח והנתונים סונכרנו ✓");
}

let pendingRestore=null;
async function makeBackup(){
  const data=JSON.stringify({app:"project-tracker",version:3,created:new Date().toISOString(),projects:projects,settings:settings,team:team},null,1);
  const name="גיבוי מעקב פרויקטים "+today()+".json";
  if(window.Android&&window.Android.shareFile){window.Android.shareFile(data,name,"application/json");return}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(!dl){downloadText(name,data,"application/json");return}
  try{await dl.save({filename:name,data:data,mimeType:"application/json"});toast("הגיבוי נשמר")}catch(e){if(e&&e.code!=="declined")toast("הגיבוי נכשל")}
}
function readRestore(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.projects!=="object"||!Object.keys(d.projects).length)throw 0;
      pendingRestore=d;renderSettings();document.getElementById("restoreBox").scrollIntoView({block:"center"})}
    catch(e){toast("הקובץ הזה אינו גיבוי תקין")}};
  r.readAsText(file);
}
async function doRestore(){
  const d=pendingRestore; if(!d)return; pendingRestore=null;
  const next={};Object.keys(d.projects).forEach(k=>next[k]=norm(d.projects[k]));
  const newSettings=normSettings(Object.assign({},settings,d.settings||{}));
  if(mode==="db"){
    try{
      for(const k of Object.keys(projects))if(!next[k])await col.doc(k).delete();
      for(const k of Object.keys(next))await col.doc(k).set(JSON.parse(JSON.stringify(next[k])));
      await settingsRef.set(JSON.parse(JSON.stringify(newSettings)));
    }catch(e){toast("השחזור נכשל");return}
  }
  if(d.team){team=normTeam(d.team);if(mode==="db"&&teamRef){try{await teamRef.set(JSON.parse(JSON.stringify(team)))}catch(e){}}}
  if(mode!=="db"){const now=Date.now();Object.keys(projects).forEach(k=>{if(!next[k])deleted[k]=now});
    Object.values(next).forEach(p=>{p._u=now;p.tasks=p.tasks.map(t=>Object.assign({},t,{_u:now}))});newSettings._u=now;team._u=now}
  projects=next;settings=newSettings;if(mode!=="db")lsSave();
  toast("הנתונים שוחזרו");location.hash="";render(true);
}

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function addMail(){const inp=document.getElementById("newmail");const v=(inp.value||"").trim().toLowerCase();
  if(!EMAIL_RE.test(v)){toast("כתובת המייל לא תקינה");inp.focus();return}
  if(settings.recipients.includes(v)){toast("הכתובת כבר ברשימה");return}
  saveSettings({recipients:settings.recipients.concat([v])});inp.value="";renderSettings();toast("הנמען נוסף")}
function addTask(id){const inp=document.getElementById("newtask");const v=inp?inp.value.trim():"";if(!v){if(inp)inp.focus();return}
  const tasks=projects[id].tasks.concat([{id:"t"+Date.now().toString(36),text:v,opened:today(),done:""}]);inp.value="";save(id,{tasks});render(true);toast("המשימה נוספה")}

  if(t.dataset.sd!=null){const wk=dkey(weekStart(weekOffset));const w=team.weeks[wk]=team.weeks[wk]||{};const d=w[t.dataset.sd]=w[t.dataset.sd]||{};
    if(t.value)d[t.dataset.se]=Object.assign({},d[t.dataset.se]||{},{p:t.value});else delete d[t.dataset.se];saveTeam();renderSchedule();return}
  if(t.dataset.sn!=null){const wk=dkey(weekStart(weekOffset));const d=((team.weeks[wk]||{})[t.dataset.sn]||{})[t.dataset.se];if(d){d.n=t.value;saveTeam()}return}
  if(t.id==="rmText"||t.id==="rmDate"||t.id==="rmTime"){readRm();return}
  if(t.id&&t.id.startsWith("mt")){readMt();if(t.id==="mtProj"&&mt.project&&projects[mt.project]&&!mt.location)renderMeeting(false);return}
  if(t.id==="emailEnabled"){if(t.checked&&!settings.recipients.length)toast("כדאי להוסיף נמען אחד לפחות");saveSettings({emailEnabled:t.checked});return}
  if(t.id==="emailHour"||t.id==="pushHour"){saveSettings({[t.id]:+t.value});toast("נשמר");return}
  const id=currentId(); if(!id||!projects[id])return; const p=projects[id];
  if(t.dataset.set){const sets=JSON.parse(JSON.stringify(p.sets));sets[t.dataset.set][t.dataset.f]=t.value;save(id,{sets});t.className="pill "+cls(t.value)}
  else if(t.dataset.item){const items=JSON.parse(JSON.stringify(p.items));items[t.dataset.item][t.dataset.f]=t.value;save(id,{items});t.className="pill "+cls(t.value)}
  else if(t.dataset.check){save(id,{[t.dataset.check]:t.value});t.className="pill "+cls(t.value)}
});
app.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value.trim();const pos=e.target.selectionStart;renderList(location.hash==="#done");const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
app.addEventListener("focusout",e=>{
  if(e.target.id==="fromMail"){const v=e.target.value.trim().toLowerCase();if(v&&!EMAIL_RE.test(v)){toast("כתובת השולח לא תקינה");return}if(v!==settings.from){saveSettings({from:v});toast("נשמר")}return}
  const id=currentId(); if(!id||!projects[id])return;
  if(e.target.id==="name"){const v=e.target.value.trim()||"ללא שם";if(v!==projects[id].name)save(id,{name:v})}
  if(e.target.id==="notes"){if(e.target.value!==projects[id].notes)save(id,{notes:e.target.value})}
});
app.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="name")e.target.blur();
  if(e.target.id==="newtask"){const id=currentId();if(id)addTask(id)}
  if(e.target.id==="newmail")addMail();
  if(e.target.id==="etUpd")addUpdate();
  if(e.target.id==="newEmp")addEmp();
  if(e.target.id==="fromMail")e.target.blur();
});
window.addEventListener("hashchange",()=>{render(true);window.scrollTo(0,0)});

async function exportCsv(){
  const head=["פרויקט","סטטוס פרויקט"].concat(...SETS.map(([,l])=>[l+" - הזמנה",l+" - סטטוס"]),ITEMS.flatMap(([,l])=>[l+" - הזמנה",l+" - סטטוס"]),CHECKS.map(([,l])=>l),STEPS.flatMap(s=>[s+" - אושר לביצוע",s+" - בוצע"]),["משימות פתוחות","הערות"]);
  const rows=sorted().map(([,p])=>[p.name,p.status].concat(...SETS.map(([k])=>[p.sets[k].order,p.sets[k].status]),ITEMS.flatMap(([k])=>[p.items[k].order,p.items[k].status]),CHECKS.map(([k])=>p[k]),p.steps.flatMap(s=>s.na?["N/A","N/A"]:[s.plan,s.done]),[p.tasks.filter(x=>!x.done).map(x=>x.text).join(" | "),p.notes]));
  const csv="\ufeff"+[head].concat(rows).map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const name="מעקב פרויקטים "+today()+".csv";
  if(window.Android){window.Android.shareCsv(csv,name);return}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(!dl){downloadText(name,csv,"text/csv");return}
  try{await dl.save({filename:name,data:csv});toast("הקובץ נשמר")}
  catch(e){if(e&&e.code!=="declined")toast("הייצוא נכשל")}
}

function applyPending(){
  let list=[];try{list=JSON.parse(window.Android.takePending()||"[]")}catch(e){}
  if(!list.length)return false;
  const now=Date.now();
  list.forEach(c=>{const p=projects[c.pid];if(!p)return;p._u=now;p.tasks=p.tasks.map(t=>t.id===c.tid?Object.assign({},t,{done:c.done||today(),_u:now}):t)});
  lsSave(); return true;
}
window.syncFromNative=function(){if(mode==="local"&&window.Android&&window.Android.takePending&&applyPending())render(true);if(mode==="local")syncNow(false)};
// ---------- boot ----------
(function(){const sp=document.getElementById("splash");if(!sp)return;if(/^#(newtask|meeting|reminder|t-)/.test(location.hash)){sp.remove();return}
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),450)},reduce?800:4000)})();
render(true);
(async()=>{
  let db=null;
  try{db=!window.Android&&window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(db){
    mode="db"; col=db.collection("projects"); settingsRef=db.doc("settings/main");
    col.onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=norm(v)});projects=next;ensureGeneral();render(false)},()=>toast("החיבור לנתונים נקטע, רענן את הדף"));
    settingsRef.onSnapshot(s=>{settings=normSettings(s.exists?s.data():null);if(location.hash==="#settings")render(false)},()=>{});
    teamRef=db.doc("team/main"); teamRef.onSnapshot(s=>{team=normTeam(s.exists?s.data():null);if(location.hash==="#schedule")render(false)},()=>{});
  }else{
    mode="local";
    let raw=lsLoad(LS)||{};
    if(!Object.keys(raw).length&&typeof SEED!=="undefined"&&!localStorage.getItem(LS+"-seeded")){raw=SEED;try{localStorage.setItem(LS+"-seeded","1")}catch(e){}}
    projects={};Object.keys(raw).forEach(k=>projects[k]=norm(raw[k]));
    if(!projects[GENERAL])projects[GENERAL]=norm(generalBlank());
    settings=normSettings(lsLoad(LS_SET)); team=normTeam(lsLoad(LS_TEAM)); deleted=lsLoad(LS_DEL)||{};
    if(window.Android&&window.Android.takePending)applyPending();
    syncQuiet=true;lsSave();syncQuiet=false;render(true);
    if(syncCfg())setTimeout(()=>syncNow(false),600);
    setInterval(()=>{if(syncCfg()&&!document.hidden)syncNow(false)},120000);
  }
})();
})();
